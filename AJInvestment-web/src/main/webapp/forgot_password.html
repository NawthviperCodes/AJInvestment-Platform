<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AJ Investment - Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:#c9a84c; --gold-light:#e8c97a; --gold-dim:#7a6330;
      --dark:#0b0c0e; --dark-2:#13151a; --dark-3:#1c1f27; --dark-4:#252932;
      --text:#e2ddd4; --text-muted:#7a7870; --error:#c0392b; --success:#27ae60; --radius:6px;
    }
    body { min-height:100vh; background:var(--dark); font-family:'Josefin Sans',sans-serif; color:var(--text); display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative; overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 80% 60% at 20% 10%, rgba(201,168,76,.06), transparent 60%), radial-gradient(ellipse 60% 80% at 80% 90%, rgba(201,168,76,.04), transparent 60%); pointer-events:none; }
    body::after { content:''; position:fixed; top:-20%; right:-5%; width:1px; height:140%; background:linear-gradient(180deg, transparent, var(--gold-dim), transparent); transform:rotate(-8deg); pointer-events:none; }
    .wrapper { width:100%; max-width:480px; position:relative; }
    .header { text-align:center; margin-bottom:48px; animation:fadeDown .7s ease both; }
    .monogram { font-family:'Cormorant Garamond',serif; font-size:48px; font-weight:300; color:var(--gold); letter-spacing:6px; line-height:1; margin-bottom:8px; }
    .header h1 { font-weight:300; font-size:11px; letter-spacing:5px; text-transform:uppercase; color:var(--text-muted); }
    .divider { width:40px; height:1px; background:var(--gold); margin:20px auto; }
    .header p { font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:300; color:var(--text-muted); letter-spacing:1px; }
    .card { background:var(--dark-2); border:1px solid rgba(201,168,76,.12); border-radius:var(--radius); padding:48px; animation:fadeUp .7s ease .1s both; position:relative; overflow:hidden; }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, transparent, var(--gold), transparent); }
    .section-label { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:24px; display:flex; align-items:center; gap:12px; }
    .section-label::after { content:''; flex:1; height:1px; background:rgba(201,168,76,.18); }
    .helper { color:var(--text-muted); font-size:13px; line-height:1.6; margin-bottom:24px; }
    .field { display:flex; flex-direction:column; gap:7px; margin-bottom:24px; }
    .field label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--text-muted); }
    .req { color:var(--gold); margin-left:2px; }
    .field input { background:var(--dark-3); border:1px solid rgba(255,255,255,.07); border-radius:var(--radius); color:var(--text); font-family:'Josefin Sans',sans-serif; font-size:13px; font-weight:300; letter-spacing:1px; padding:13px 16px; outline:none; transition:border-color .2s, background .2s; }
    .field input:focus { border-color:rgba(201,168,76,.5); background:var(--dark-4); }
    .field input.valid { border-color:rgba(39,174,96,.5); }
    .field input.invalid { border-color:rgba(192,57,43,.5); }
    .field-msg { font-size:10px; letter-spacing:1px; min-height:14px; }
    .field-msg.ok { color:var(--success); }
    .field-msg.err { color:var(--error); }
    .submit-wrap { margin-top:16px; display:flex; flex-direction:column; gap:16px; }
    .btn-submit { width:100%; padding:16px; background:var(--gold); border:0; border-radius:var(--radius); color:var(--dark); font-family:'Josefin Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:4px; text-transform:uppercase; cursor:pointer; transition:background .2s, transform .1s; }
    .btn-submit:hover { background:var(--gold-light); }
    .btn-submit:active { transform:scale(.99); }
    .btn-submit:disabled { background:var(--gold-dim); cursor:not-allowed; opacity:.6; }
    .spinner { display:none; width:16px; height:16px; border:2px solid rgba(0,0,0,.3); border-top-color:var(--dark); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto; }
    .loading .btn-label { display:none; }
    .loading .spinner { display:block; }
    .back-link { text-align:center; font-size:11px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; }
    .back-link a { color:var(--gold); text-decoration:none; }
    .back-link a:hover { color:var(--gold-light); }
    #toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--dark-3); border:1px solid rgba(201,168,76,.2); border-radius:var(--radius); padding:14px 28px; font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; white-space:nowrap; z-index:100; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.success { border-color:rgba(39,174,96,.4); color:var(--success); }
    #toast.error { border-color:rgba(192,57,43,.4); color:var(--error); }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:580px) { .card { padding:32px 24px; } #toast { white-space:normal; width:calc(100% - 40px); text-align:center; } }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="monogram">AJ</div>
    <h1>Investment Group</h1>
    <div class="divider"></div>
    <p>Reset your password</p>
  </div>
  <div class="card">
    <form id="forgotForm" action="ForgotPassword" method="POST" novalidate>
      <div class="section-label">Forgot Password</div>
      <p class="helper">Enter the email address on your AJ Investment account and we will send you a secure reset link.</p>
      <div class="field">
        <label>Email Address <span class="req">*</span></label>
        <input type="email" name="email" id="email" placeholder="john@example.com" autocomplete="email" required/>
        <span class="field-msg" id="msg-email"></span>
      </div>
      <div class="submit-wrap">
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-label">Send Reset Link</span>
          <span class="spinner"></span>
        </button>
        <p class="back-link"><a href="login.html">Back to sign in</a></p>
      </div>
    </form>
  </div>
</div>
<div id="toast"></div>
<script>
  const $ = id => document.getElementById(id);
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function setMsg(id, text, type) { const el = $(id); el.textContent = text; el.className = 'field-msg ' + (type || ''); }
  function markField(id, valid) { const inp = $(id); inp.classList.toggle('valid', valid === true); inp.classList.toggle('invalid', valid === false); }
  function showToast(msg, type) { const t = $('toast'); t.textContent = msg; t.className = 'show ' + (type || ''); clearTimeout(t._timer); t._timer = setTimeout(() => { t.className = ''; }, 4500); }
  $('email').addEventListener('input', () => {
    const v = $('email').value.trim();
    if (EMAIL_RE.test(v)) { setMsg('msg-email', 'Looks good', 'ok'); markField('email', true); }
    else { setMsg('msg-email', '', ''); markField('email', null); }
  });
  $('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = $('email').value.trim();
    if (!EMAIL_RE.test(email)) {
      setMsg('msg-email', 'Enter a valid email address', 'err');
      markField('email', false);
      showToast('Please enter a valid email', 'error');
      return;
    }
    const btn = $('submitBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    try {
      const data = new FormData(this);
      const res = await fetch('/AJInvestment/ForgotPassword', { method: 'POST', body: data });
      const json = await res.json();
      showToast(json.message || (res.ok ? 'Reset link sent' : 'Request failed'), res.ok ? 'success' : 'error');
      if (!res.ok) { btn.classList.remove('loading'); btn.disabled = false; }
    } catch (err) {
      showToast('Server error - please try again', 'error');
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
